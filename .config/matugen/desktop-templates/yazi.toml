    fg = "{{colors.surface_container_lowest.default.hex}}",
    bg = "<* if {{ is_dark_mode }} *>{{colors.primary.default.hex | set_lightness: 68.0}}<* else *>{{colors.primary.default.hex}}<* endif *>",
    bold = true
}
preview = { fg = "<* if {{ is_dark_mode }} *>{{colors.tertiary.default.hex | set_lightness: 76.0}}<* else *>{{colors.tertiary.default.hex}}<* endif *>" }

[tabs]
