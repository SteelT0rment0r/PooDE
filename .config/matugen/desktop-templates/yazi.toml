
# Generated by Matugen — do not edit manually.
# Shared neon ANSI palette, matching Kitty.
# Mode-conditional lines follow matugen's is_dark_mode: light mode drops
# the lightness pull (light roles already read dark on a light surface),
# inverted slots are forced down to 42; the two highlight backgrounds
# (|84 / |80) stay absolute so their on_surface text keeps a light bed.

# No [app] overall bg on purpose: an explicit background colour is frozen at
# whatever was current when yazi started, so the next wallpaper change leaves
# it mismatched with kitty's default background and kitty renders those cells
# opaque — a solid block where kitty itself is translucent. Painting nothing
# there means yazi always shows kitty's own background (opacity and blur).

[mgr]
cwd = { fg = "<* if {{ is_dark_mode }} *>{{colors.primary.default.hex | set_lightness: 68.0}}<* else *>{{colors.primary.default.hex}}<* endif *>", bold = true }

find_keyword = { fg = "<* if {{ is_dark_mode }} *>{{colors.primary.default.hex | invert | set_lightness: 72.0}}<* else *>{{colors.primary.default.hex | invert | set_lightness: 42.0}}<* endif *>", bold = true }
find_position = { fg = "<* if {{ is_dark_mode }} *>{{colors.tertiary.default.hex | set_lightness: 76.0}}<* else *>{{colors.tertiary.default.hex}}<* endif *>", bold = true }

marker_copied = { fg = "<* if {{ is_dark_mode }} *>{{colors.secondary.default.hex | set_hue: 160.0 | set_lightness: 70.0}}<* else *>{{colors.secondary.default.hex | set_hue: 160.0}}<* endif *>", bg = "<* if {{ is_dark_mode }} *>{{colors.secondary.default.hex | set_hue: 160.0 | set_lightness: 70.0}}<* else *>{{colors.secondary.default.hex | set_hue: 160.0}}<* endif *>" }
marker_cut = { fg = "<* if {{ is_dark_mode }} *>{{colors.secondary.default.hex | set_hue: 5.0 | set_lightness: 70.0}}<* else *>{{colors.secondary.default.hex | set_hue: 5.0}}<* endif *>", bg = "<* if {{ is_dark_mode }} *>{{colors.secondary.default.hex | set_hue: 5.0 | set_lightness: 70.0}}<* else *>{{colors.secondary.default.hex | set_hue: 5.0}}<* endif *>" }
marker_marked = { fg = "<* if {{ is_dark_mode }} *>{{colors.tertiary.default.hex | set_lightness: 76.0}}<* else *>{{colors.tertiary.default.hex}}<* endif *>", bg = "<* if {{ is_dark_mode }} *>{{colors.tertiary.default.hex | set_lightness: 76.0}}<* else *>{{colors.tertiary.default.hex}}<* endif *>" }
