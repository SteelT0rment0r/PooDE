/* Flat colour list for dunst, rendered on every wallpaper change.
   dunst has no include/import, and toggle-focus.sh rewrites the
   transparency / corner_radius lines of ~/.config/dunst/dunstrc, so the
   config must not be regenerated wholesale: hypr/scripts/apply-dunst-colors
   patches only these colour values into dunstrc and reloads dunst.

   Keep the surface derivation in sync with desktop-templates/waybar.css
   (small shadowed surfaces: the scheme's own saturation at light 6.5 —
   same as the bar circles; light mode pushes up to 96 with it).
   The critical values reuse the @neon-red derivation from
   desktop-templates/rofi.rasi so popup alerts match the notification
   center rows. */
background = <* if {{ is_dark_mode }} *>{{colors.background.default.hex | set_lightness: 6.5}}<* else *>{{colors.background.default.hex | set_lightness: 96.0}}<* endif *>
foreground = {{colors.on_surface.default.hex}}
frame = <* if {{ is_dark_mode }} *>{{colors.primary.default.hex | set_lightness: 48.0}}<* else *>{{colors.primary.default.hex}}<* endif *>
critical = <* if {{ is_dark_mode }} *>{{colors.secondary.default.hex | set_hue: 5.0 | set_lightness: 76.0 | saturate: -15.0, "hsl"}}<* else *>{{colors.secondary.default.hex | set_hue: 5.0 | saturate: -15.0, "hsl"}}<* endif *>
